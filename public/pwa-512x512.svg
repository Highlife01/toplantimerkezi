<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#090E17" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="goldGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="30%" stop-color="#F59E0B" />
      <stop offset="70%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad512)" />
  <rect x="4" y="4" width="504" height="504" rx="108" fill="none" stroke="#D97706" stroke-width="4" stroke-opacity="0.3" />
  
  <!-- Modern Geometric Meeting / Center Emblem -->
  <g transform="translate(106, 106) scale(3.12)" filter="url(#glow)">
    <!-- Layered Diamonds/Roof of Architecture -->
    <path d="M48 8 L88 28 L48 48 L8 28 Z" fill="url(#goldGrad512)" />
    <path d="M8 48 L48 68 L88 48" fill="none" stroke="#FCD34D" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M8 68 L48 88 L88 68" fill="none" stroke="#D97706" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Center Core Point -->
    <circle cx="48" cy="28" r="5" fill="#FFFFFF" />
  </g>
</svg>
